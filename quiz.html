<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Quiz – AI Tutor</title>
<style>

:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mute:#6b7190;--brand:#4f46e5;--brand-ink:#fff;--bot:#fff;--user:#4f46e5;--line:#e3e6f0;--chip:#eef0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--card:#1b1e2e;--ink:#eceefb;--mute:#9aa0c3;--brand:#818cf8;--brand-ink:#12141f;--bot:#1b1e2e;--user:#4f46e5;--line:#2c3048;--chip:#262a45}}
:root[data-theme="dark"]{--bg:#12141f;--card:#1b1e2e;--ink:#eceefb;--mute:#9aa0c3;--brand:#818cf8;--brand-ink:#12141f;--bot:#1b1e2e;--user:#4f46e5;--line:#2c3048;--chip:#262a45}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
nav.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.nav a{text-decoration:none;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500}
nav.nav a.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn-outline{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:500;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.err{color:#e11d48;font-size:14px;margin-top:8px}

.q-opt{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer;font-size:15px}
.q-opt.correct{background:#dcfce7;border-color:#16a34a;color:#14532d;font-weight:600}
.q-opt.wrong{background:#ffe4e6;border-color:#e11d48;color:#881337}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
</style>
</head>
<body>
<header>
  <div class="top-bar"><h1>📝 Practice Quiz</h1></div>
  
<nav class="nav">
  <a href="index.html" class="">💬 Tutor</a>
  <a href="quiz.html" class="active">📝 Quiz</a>
  <a href="flashcards.html" class="">🗂️ Flashcards</a>
  <a href="notes.html" class="">📄 Notes</a>
  <a href="history.html" class="">🕒 History</a>
  <a href="settings.html" class="">⚙️ Settings</a>
</nav>

</header>
<main>
  <div class="card" id="setup">
    <label>Topic or Chapter</label>
    <input id="topic" placeholder="e.g. Photosynthesis, Quadratic Equations, Mughal Empire">
    <div class="grid-2">
      <div>
        <label>Subject</label>
        <select id="subj">
          <option>General</option><option>Maths</option><option>Physics</option><option>Chemistry</option>
          <option>Biology</option><option>English</option><option>Coding</option><option>History</option>
        </select>
      </div>
      <div>
        <label>Difficulty</label>
        <select id="diff">
          <option>Easy</option><option selected>Medium</option><option>Hard</option>
        </select>
      </div>
    </div>
    <button class="btn" id="startBtn" style="width:100%;margin-top:6px">Generate 5 Questions</button>
    <div id="err" class="err"></div>
  </div>
  <div id="quizBox"></div>
</main>
<script>

const DEFAULT_KEY = "";
function getApiKey() { return localStorage.getItem("ai_tutor_key") || DEFAULT_KEY; }
function getLang() { return localStorage.getItem("ai_tutor_lang") || "auto"; }
(function applyTheme(){
  const t = localStorage.getItem("ai_tutor_theme") || "system";
  if(t !== "system") document.documentElement.setAttribute("data-theme", t);
})();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function md(src){
  const out=[];let list=null;
  const close=()=>{if(list){out.push("</"+list+">");list=null}};
  src.split("\n").forEach(l=>{
    let m;
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>")}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>")}}
    else if(l.trim()===""){close()}
    else{close();out.push("<p>"+inline(l.replace(/^#+\s*/,""))+"</p>")}
  }});close();return out.join("");
}
async function callGemini(parts) {
  const key = getApiKey();
  if(!key) throw new Error("API Key missing! Please open the ⚙️ Settings tab and paste your Gemini API key.");
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({contents: [{parts}]})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error?.message || "API Error");
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
}

const startBtn = document.getElementById("startBtn");
const quizBox = document.getElementById("quizBox");
const errEl = document.getElementById("err");

startBtn.onclick = async () => {
  const topic = document.getElementById("topic").value.trim();
  const subj = document.getElementById("subj").value;
  const diff = document.getElementById("diff").value;
  if(!topic) { errEl.textContent = "Please enter a topic first."; return; }
  errEl.textContent = "";
  startBtn.disabled = true;
  startBtn.textContent = "Creating Quiz...";
  quizBox.innerHTML = "";

  const lang = getLang();
  const langNote = lang === "auto" ? "same language as the topic" : lang;
  const prompt = `Create a 5-question multiple-choice quiz on "${topic}" (Subject: ${subj}, Difficulty: ${diff}) in ${langNote}.
Return ONLY valid JSON array with no markdown fences, format:
[{"q":"Question text","options":["Option A","Option B","Option C","Option D"],"ans":0,"exp":"Short 1-line explanation"}]
where "ans" is the 0-based index (0 to 3) of the correct option.`;

  try {
    let raw = await callGemini([{text: prompt}]);
    raw = raw.replace(/```json|```/g, "").trim();
    const questions = JSON.parse(raw);
    renderQuiz(questions);
  } catch(e) {
    errEl.textContent = "Error: " + (e.message || "Could not generate quiz.");
  }
  startBtn.disabled = false;
  startBtn.textContent = "Generate 5 Questions";
};

function renderQuiz(qs) {
  let score = 0, answered = 0;
  quizBox.innerHTML = `<div class="card" id="scoreCard" style="font-weight:600;text-align:center">Score: 0 / ${qs.length}</div>`;
  qs.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div style="font-weight:600;margin-bottom:8px">Q${idx+1}. ${esc(item.q)}</div>`;
    const expDiv = document.createElement("div");
    expDiv.style.cssText = "font-size:14px;color:var(--mute);margin-top:8px;display:none";
    expDiv.textContent = "💡 " + item.exp;

    const btns = [];
    item.options.forEach((opt, oIdx) => {
      const b = document.createElement("button");
      b.className = "q-opt";
      b.textContent = opt;
      b.onclick = () => {
        if(card.dataset.done) return;
        card.dataset.done = "1";
        answered++;
        if(oIdx === item.ans) { b.classList.add("correct"); score++; }
        else { b.classList.add("wrong"); btns[item.ans]?.classList.add("correct"); }
        expDiv.style.display = "block";
        document.getElementById("scoreCard").textContent = `Score: ${score} / ${qs.length} (Answered: ${answered}/${qs.length})`;
      };
      btns.push(b);
      card.appendChild(b);
    });
    card.appendChild(expDiv);
    quizBox.appendChild(card);
  });
}
</script>
</body>
</html>
